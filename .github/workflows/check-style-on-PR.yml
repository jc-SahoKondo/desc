name: reviewdog-checkstyle

on:
  pull_request:
    paths:
      - '**/*.java'

jobs:
  checkstyle:
    name: Run Checkstyle with Reviewdog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Download checkstyle.jar
        run: |
          curl -L -o checkstyle.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.23.0/checkstyle-10.23.0-all.jar

      - name: Run Checkstyle and Reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          java -jar checkstyle.jar -c google_checks.xml -f xml $(find . -name "*.java") > checkstyle-result.xml
          cat checkstyle-result.xml | reviewdog -f=checkstyle -name="checkstyle" -reporter=github-pr-review -level=warning
