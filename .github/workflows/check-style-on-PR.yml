name: reviewdog-checkstyle

on:
  pull_request:
    paths:
      - '**/*.java'

jobs:
  checkstyle:
    name: Run Checkstyle with Reviewdog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # 必要に応じて変更

      - name: Download checkstyle.jar
        run: |
          curl -L -o checkstyle.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.23.0/checkstyle-10.23.0-all.jar

      - name: Run Checkstyle
        run: |
          java -jar checkstyle.jar -c google_checks.xml -f xml $(find . -name "*.java") > checkstyle-result.xml

      - name: Run reviewdog
        uses: reviewdog/action-reviewdog@v5
        with:
          name: checkstyle
          reporter: github-pr-review
          level: warning
          filter_mode: file
          fail_on_error: false
          reviewdog_flags: -f=checkstyle -name="checkstyle"
          tool_name: checkstyle
          github_token: ${{ secrets.GITHUB_TOKEN }}
          input: checkstyle-result.xml
