name: Issue作成時 ラベル、マイルストーンを追加

on:
  issues:
    types: [ opened, edited ]

jobs:
  set-issues:
    runs-on: ubuntu-latest

    steps:
      - name: ラベルとマイルストーンを設定
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue?.body) {
              console.log("Issue body is empty or undefined.");
              return;
            }
            
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            
            // 本文から関連Issue番号を取得
            const relatedIssueMatch = issue.body.match(/関連Issue: #(\d+)/);
            if (relatedIssueMatch) {
              const relatedIssueNumber = relatedIssueMatch[1];

              try {
                // 関連Issueの情報を取得
                const { data: relatedIssue } = await github.rest.issues.get({
                    owner: repoOwner,
                    repo: repoName,
                    issue_number: relatedIssueNumber,
                });

                // 既存のラベルを取得
                const existingLabels = relatedIssue.labels.map(label => label.name);

                // "bug" ラベルがない場合に追加
                if (!existingLabels.includes("bug")) {
                  existingLabels.push("bug");
                  await github.rest.issues.update({
                      owner: repoOwner,
                      repo: repoName,
                      issue_number: relatedIssueNumber,
                      labels: existingLabels,
                  });
                  console.log(`Added "bug" label to issue #${relatedIssueNumber}`);
                } else {
                  console.log(`Issue #${relatedIssueNumber} already has "bug" label.`);
                }
              } catch (error) {
                console.error(`Failed to update related issue #${relatedIssueNumber}:`, error);
              }
            }
            
            // 本文から親Issue番号を取得
            const parentIssueMatch = issue.body.match(/マージ先: #(\d+)/);
            if (!parentIssueMatch) {
              console.log("No issue found in body.");
              return;
            }
            
            const parentIssueNumber = parseInt(parentIssueMatch[1]);

            try {
              // 親issueの情報を取得
              const { data: parentIssue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parentIssueNumber,
              });
          
              // フィルタリングするラベルを定義
              const excludedLabels = new Set(["stg", "dev", "fixed", "parent issue", "hotfix", "bug"]);
              const labelsToSet = parentIssue.labels
                  .map(label => label.name)
                  .filter(label => !excludedLabels.has(label));
          
              // マイルストーンを取得
              const milestoneToSet = parentIssue.milestone?.number || null;
          
              // issueのラベルとマイルストーンを更新
              await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: labelsToSet,
                  milestone: milestoneToSet,
              });
          
              console.log(`Updated issue #${issue.number} with labels: ${labelsToSet} and milestone: ${milestoneToSet}`);

            } catch (error) {
              console.error(`Error updating issue #${issue.number}:`, error);
            }