name: PR作成時 ラベル、マイルストーン、担当者追加

on:
  pull_request:
    types: [ opened, edited ]

jobs:
  set-pr:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: ラベル、マイルストーン、担当者を設定
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || !pr.body) {
              console.log("PR data is missing or PR body is empty.");
              return;
            }

            const { number: prNumber, user: { login: creator } } = pr;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;

            // PRの本文からIssue番号を取得
            const issueNumber = extractIssueNumber(pr.body, /Issue: #(\d+)/);
            if (!issueNumber) {
              console.log("No related issue found in PR body.");
              return;
            }

            try {
              // 関連Issueのデータを取得
              const { data: issueData } = await github.rest.issues.get({
                  owner: repoOwner,
                  repo: repoName,
                  issue_number: issueNumber,
              });
            
              const issueLabels = issueData.labels.map(label => label.name);
              const excludedLabels = new Set(["parent issue", "dev", "stg", "fixed"]);
              const labelsToSet = issueLabels.filter(label => !excludedLabels.has(label));
              const milestoneToSet = issueData.milestone?.number || null;
              const isParentIssue = issueLabels.includes("parent issue");
              const isHotFix = issueLabels.includes("hotfix");
            
              // Issueの担当者を取得し、いなければPR作成者を担当にする
              const assignees = issueData.assignees.length > 0 ? issueData.assignees.map(a => a.login) : [creator];
            
              // PRにマイルストーン・担当者・ラベルを設定
              await github.rest.issues.update({
                  owner: repoOwner,
                  repo: repoName,
                  issue_number: prNumber,
                  milestone: milestoneToSet,
                  assignees,
                  labels: labelsToSet,
              });
            
              console.log(`Updated PR #${prNumber}: milestone=${milestoneToSet}, assignees=${assignees}, labels=${labelsToSet}`);
            
              // 親Issueでなければ、Issueにも担当者・ラベルを設定
              if (!isParentIssue) {
                await github.rest.issues.update({
                    owner: repoOwner,
                    repo: repoName,
                    issue_number: issueNumber,
                    assignees,
                });

                if (!isHotFix) {
                  await github.rest.issues.addLabels({
                      owner: repoOwner,
                      repo: repoName,
                      issue_number: issueNumber,
                      labels: ["ready for review"],
                  });
                  console.log(`Added "ready for review" label to issue #${issueNumber}`);
                }
              }
            } catch (error) {
              console.error(`Failed to update PR #${prNumber} and issue #${issueNumber}:`, error);
            }

            // 本文からIssue番号を抽出する関数
            function extractIssueNumber(body, regex) {
                const match = body.match(regex);
                return match ? match[1] : null;
            }